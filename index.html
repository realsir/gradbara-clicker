<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradbara Clicker</title>
  <link href="https://fonts.cdnfonts.com/css/public-pixel" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --shadow: 0 16px 40px rgba(0,0,0,0.06);
      --pixel-font: 'Public Pixel', monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: var(--pixel-font);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 0;
    }

    .title-trigger {
      border: 2px solid var(--text);
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
      padding: 20px 28px;
      cursor: pointer;
      font-family: var(--pixel-font);
      font-size: clamp(22px, 4vw, 42px);
      line-height: 1.6;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(0) scale(0.97);
      animation: revealTitle 1.8s ease forwards;
    }

    .title-trigger:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .game {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(16px);
    }

    .game.active {
      display: flex;
      animation: fadeUp 0.8s ease forwards;
    }

    .click-image {
      width: min(340px, 75vw);
      height: min(340px, 75vw);
      object-fit: cover;
      image-rendering: pixelated;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .click-image:hover { transform: scale(1.03); }
    .click-image:active { transform: scale(0.96); }

    .counter {
      background: rgba(255,255,255,0.92);
      border: 2px solid var(--text);
      padding: 12px 18px;
      box-shadow: var(--shadow);
      font-size: clamp(12px, 2vw, 18px);
      line-height: 1.6;
    }

    .progress {
      width: min(320px, 70vw);
      height: 24px;
      border: 2px solid var(--text);
      background: rgba(0,0,0,0.05);
      overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        90deg,
        #111111 0 18px,
        #2d2d2d 18px 36px
      );
      transition: width 0.25s ease;
    }

    .ending {
      display: none;
      font-size: clamp(24px, 4vw, 48px);
      padding: 20px 28px;
      background: rgba(255,255,255,0.92);
      border: 2px solid var(--text);
      box-shadow: var(--shadow);
      animation: endingReveal 1s ease forwards;
      cursor: pointer;
      text-align: center;
    }

    .ending.active {
      display: inline-block;
    }

    .boom {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(255,200,100,0.9), rgba(255,140,0,0.75) 45%, transparent 75%);
      opacity: 0;
      pointer-events: none;
    }

    .boom.active {
      animation: boom 1s ease forwards;
    }

    @keyframes revealTitle {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes boom {
      0% { opacity: 0; transform: scale(0.6); }
      25% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    @keyframes endingReveal {
      from { opacity: 0; transform: scale(0.85) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 640px) {
      .screen { gap: 20px; padding: 0; }
      .title-trigger { padding: 16px 22px; }
    }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>

  <main class="screen">
    <button class="title-trigger" id="startButton">GRADBARA CLICKER ./</button>

    <section class="game" id="gamePanel">
      <div style="position: relative;">
        <img class="click-image" id="clickImage" src="1.png" alt="Gradbara" />
        <div class="boom" id="boomFx"></div>
      </div>

      <div class="counter" id="counterText">CLICKS: 0</div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <div class="ending" id="endingText">U R SO RICH ./</div>
  </main>

  <script>
    const startButton = document.getElementById('startButton');
    const gamePanel = document.getElementById('gamePanel');
    const clickImage = document.getElementById('clickImage');
    const counterText = document.getElementById('counterText');
    const progressFill = document.getElementById('progressFill');
    const endingText = document.getElementById('endingText');
    const boomFx = document.getElementById('boomFx');

    const stages = ['1.png', '2.png', '3.png', '4.png'];
    let totalClicks = 0;
    let gameStarted = false;
    let finished = false;

    function render() {
      counterText.textContent = `CLICKS: ${totalClicks}`;

      if (totalClicks >= 80) {
        progressFill.style.width = '100%';
        return;
      }

      const stageIndex = Math.floor(totalClicks / 20);
      const clicksInBlock = totalClicks % 20;
      progressFill.style.width = `${(clicksInBlock / 20) * 100}%`;
      clickImage.src = stages[stageIndex];
    }

    startButton.addEventListener('click', () => {
      if (gameStarted) return;
      gameStarted = true;
      gamePanel.classList.add('active');
      startButton.remove();
    });

    clickImage.addEventListener('click', () => {
      if (!gameStarted || finished) return;
      totalClicks += 1;

      if (totalClicks < 80) {
        render();
        return;
      }

      finished = true;
      render();

      // Скрываем счётчик и шкалу
      counterText.style.display = 'none';
      progressFill.closest('.progress').style.display = 'none';

      // Анимация взрыва
      boomFx.classList.add('active');

      clickImage.style.transition = 'transform 0.3s ease, opacity 0.5s ease';
      clickImage.style.transform = 'scale(1.25)';
      clickImage.style.filter = 'brightness(1.6) contrast(1.3)';

      setTimeout(() => {
        clickImage.style.opacity = '0';
      }, 150);

      setTimeout(() => {
        clickImage.parentElement.style.display = 'none';
        endingText.classList.add('active');
      }, 800);
    });

    render();

    // Сделать надпись кликабельной и открывающей Twitter‑пост
    endingText.addEventListener('click', () => {
      const tweetText = encodeURIComponent("grad's is so rich ./");
      const url = `https://x.com/intent/post?text=${tweetText}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    // Rain animation - ONLY "./" symbols
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let drops = [];
    let animationId;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildDrops();
    }

    function buildDrops() {
      const cols = Math.max(28, Math.floor(window.innerWidth / 16));
      drops = Array.from({ length: cols }, (_, i) => ({
        x: i * (window.innerWidth / cols) + 6,
        y: Math.random() * -window.innerHeight,
        speed: 1.8 + Math.random() * 2.2,
        size: 14 + Math.random() * 16,
        opacity: 0.25 + Math.random() * 0.4
      }));
    }

    function animateRain() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'center';

      for (const drop of drops) {
        ctx.globalAlpha = drop.opacity;
        ctx.font = `${drop.size}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.fillText('./', drop.x, drop.y);
        drop.y += drop.speed;

        if (drop.y > window.innerHeight + 30) {
          drop.y = -30 - Math.random() * window.innerHeight * 0.3;
          drop.opacity = 0.25 + Math.random() * 0.4;
          drop.speed = 1.8 + Math.random() * 2.2;
          drop.size = 14 + Math.random() * 16;
        }
      }

      ctx.globalAlpha = 1;
      animationId = requestAnimationFrame(animateRain);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateRain();
  </script>
</body>
</html>
